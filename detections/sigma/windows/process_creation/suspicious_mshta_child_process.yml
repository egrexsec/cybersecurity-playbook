title: Suspicious Child Process Spawned By Mshta
id: 8b36d6e2-16e6-4ae2-b86a-d396aac273c1
status: test
description: Detects script interpreters or command shells launched directly by mshta.exe.
references:
  - https://attack.mitre.org/techniques/T1218/005/
  - https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1218.005/T1218.005.yaml
author: mell0wx
logsource:
  product: windows
  category: process_creation
detection:
  selection_parent:
    ParentImage|endswith: '\mshta.exe'
  selection_child:
    Image|endswith:
      - '\cmd.exe'
      - '\powershell.exe'
      - '\pwsh.exe'
      - '\wscript.exe'
      - '\cscript.exe'
  condition: selection_parent and selection_child
falsepositives:
  - Legacy enterprise HTML applications that intentionally launch approved child processes
  - Controlled security validation activity
date: 2026-08-03
level: high
tags:
  - attack.t1218.005
