title: Suspicious Shell Execution Spawned By Windows Service Control Manager
id: d7bfcdf8-7f68-4bcb-8a21-11f2c00f9a12
status: test
description: >-
  Detects cmd.exe or PowerShell launched directly by services.exe, a behavioral signal
  of service-mediated command execution validated with Atomic Red Team T1569.002.
references:
  - https://attack.mitre.org/techniques/T1569/002/
  - https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1569.002/T1569.002.yaml
author: mell0wx
logsource:
  product: windows
  category: process_creation
detection:
  selection_parent:
    ParentImage|endswith: '\services.exe'
  selection_child:
    Image|endswith:
      - '\cmd.exe'
      - '\powershell.exe'
  condition: selection_parent and selection_child
falsepositives:
  - Legitimate services that intentionally launch command shells or PowerShell
  - Controlled administrative or purple-team validation activity
date: 2026-07-29
level: high
tags:
  - attack.execution
  - attack.t1569.002
